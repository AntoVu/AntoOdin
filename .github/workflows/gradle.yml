name: Build with Gradle

on:
  push:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Maximum of one running workflow per pull request source branch or pushed branch
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build

      - name: Resolve built mod jar
        id: mod-jar
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)

          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one non-sources jar, found %s:\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload built mod jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.mod-jar.outputs.path }}
          archive: false
