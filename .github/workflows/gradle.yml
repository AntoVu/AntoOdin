name: Build with Gradle

on:
  push:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: '*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Maximum of one running workflow per pull request source branch or pushed branch
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build

      # One jar per Minecraft version (Stonecutter), each uploaded as its own artifact
      - name: Resolve built mod jars
        id: mod-jar
        run: |
          for v in 26.2 26.3; do
            mapfile -t jars < <(find "versions/$v/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)

            if [ "${#jars[@]}" -ne 1 ]; then
              printf 'Expected exactly one non-sources jar for %s, found %s:
' "$v" "${#jars[@]}"
              printf '%s
' "${jars[@]}"
              exit 1
            fi

            echo "path-${v//./-}=${jars[0]}" >> "$GITHUB_OUTPUT"
          done

      - name: Upload 26.2 jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.mod-jar.outputs.path-26-2 }}
          archive: false

      - name: Upload 26.3 jar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.mod-jar.outputs.path-26-3 }}
          archive: false
